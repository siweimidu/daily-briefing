name: Daily Briefing

# Publishes the AI briefing every morning in the 08:00-11:00 Asia/Shanghai window.
#
# GitHub cron is UTC and unreliable on the hour, so we fire many times on off-peak
# minutes across the window; the first trigger that actually runs publishes, and the
# once-a-day idempotency guard makes every later trigger a no-op.
#
# Mode: --publish. It records de-dup history, archives data/preview.html (human) and
# data/briefing.json (for n8n) into the repo, and only emails if Gmail secrets exist.
# n8n reads: https://raw.githubusercontent.com/<owner>/<repo>/main/data/briefing.json

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish even if one was already done today (manual test only)"
        type: boolean
        default: false
  schedule:
    # UTC 00:11/00:33/00:55, 01:11/01:33/01:55, 02:11 = Beijing 08:11-10:11
    - cron: "11,33,55 0,1,2 * * *"

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can rebase before pushing the updated state

      - name: Gate (force only on a manual human run; otherwise 08-11 Beijing + idempotency)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Manual forced run -> publish unconditionally."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "force=--force" >> "$GITHUB_OUTPUT"
          else
            H=$(TZ=Asia/Shanghai date +%H)
            echo "Current Beijing hour: $H"
            case "$H" in
              08|09|10|11) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "force=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Publish briefing
        if: steps.gate.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional repo variable: overrides `model:` in config.yaml without a
          # code change if Groq retires the configured model mid-flight.
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Set the repo variable PUSH_ENABLED=false to make this job archive only
          # (n8n publishes the single consolidated briefing). Any other value keeps
          # email + Telegram delivery from here.
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
        run: python main.py --publish ${{ steps.gate.outputs.force }}

      - name: Commit updated state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/preview.html data/briefing.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          git commit -m "chore: publish briefing state [skip ci]"
          # The runner can be behind origin/main (concurrent triggers, code pushes),
          # which makes a plain push fail with "fetch first". Rebase onto the latest
          # main and retry a few times so the state always lands.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed state on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest origin/main."
            git fetch origin main
            git rebase origin/main || {
              git checkout --theirs data/history.json data/preview.html data/briefing.json || true
              git add data/history.json data/preview.html data/briefing.json
              git rebase --continue || git rebase --abort
            }
            sleep 3
          done
          echo "::error::Failed to push updated state after 5 attempts."
          exit 1
